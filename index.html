<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>While You Sleep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&family=Fraunces:ital,opsz,wght@1,9..144,400&display=swap">
<style>
  :root{
    --outer:#EFEDEE; --edge:rgba(0,0,0,.06);
    /* these four are driven from JS as the day turns */
    --ink:#3A1230; --panel:rgba(255,255,255,.66); --hair:rgba(58,18,48,.16);
    --faint:rgba(58,18,48,.46);
    --disp:"Martian Mono",ui-monospace,monospace;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
    --ital:"Fraunces",Georgia,serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--outer:#0B0609;--edge:rgba(255,255,255,.07)}}
  :root[data-theme="dark"]{--outer:#0B0609;--edge:rgba(255,255,255,.07)}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--outer);color:var(--ink);font-family:var(--mono);
    overflow:hidden;-webkit-user-select:none;user-select:none}

  #card{position:fixed;inset:13px;border-radius:26px;overflow:hidden;border:1px solid var(--edge);
    background:#F79BCE}
  #sky{position:absolute;inset:0;z-index:0}
  #stage{position:absolute;inset:0;z-index:1}
  canvas{display:block}

  /* ---- clock ---- */
  #clock{position:absolute;z-index:4;top:24px;right:26px;display:flex;align-items:center;gap:14px}
  #clock .face{width:74px;height:74px;display:block}
  #clock .ring{fill:var(--panel);stroke:var(--hair);stroke-width:1.5}
  #clock .tick{stroke:var(--faint);stroke-width:1.6;stroke-linecap:round}
  #clock .hh{stroke:var(--ink);stroke-width:3.4;stroke-linecap:round}
  #clock .mm{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
  #clock .pin{fill:var(--ink)}
  #clock .meta{text-align:right}
  #clock .t{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:-.05em;
    line-height:1.1;font-variant-numeric:tabular-nums}
  #clock .d{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
    margin-top:3px}

  /* ---- incoming ---- */
  #in{position:absolute;z-index:3;left:26px;top:26px;width:246px}
  .lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
    margin-bottom:10px}
  #in-list{display:flex;flex-direction:column;gap:7px}
  .brief{background:var(--panel);border:1px solid var(--hair);border-radius:12px;
    padding:9px 12px;font-size:11.5px;line-height:1.38;backdrop-filter:blur(12px);
    animation:inl .3s cubic-bezier(.2,.9,.3,1.15);cursor:pointer}
  .brief .src{font-size:8px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
    margin-bottom:3px}
  .brief.go{animation:out .3s ease-in forwards}
  @keyframes inl{from{opacity:0;transform:translateX(-20px)}}
  @keyframes out{to{opacity:0;transform:translateX(120px) scale(.85)}}

  /* ---- shipped ---- */
  #out{position:absolute;z-index:3;right:26px;top:118px;bottom:92px;width:296px;
    display:flex;flex-direction:column}
  #out-list{display:flex;flex-direction:column;gap:7px;overflow:hidden;
    mask-image:linear-gradient(180deg,#000 0 78%,transparent 100%);
    -webkit-mask-image:linear-gradient(180deg,#000 0 78%,transparent 100%)}
  .done{background:var(--panel);border:1px solid var(--hair);border-radius:12px;padding:10px 12px;
    backdrop-filter:blur(12px);animation:pop .34s cubic-bezier(.2,.9,.3,1.2);flex:0 0 auto}
  .done .cap{font-size:11.5px;line-height:1.38}
  .done .tag{margin-top:6px;font-size:8px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--faint);display:flex;align-items:center;gap:6px}
  .done .tag i{width:5px;height:5px;border-radius:50%;background:#2BA97F;display:block;flex:0 0 auto}
  @keyframes pop{from{opacity:0;transform:translateY(-14px) scale(.95)}}

  /* ---- the line ---- */
  #say{position:absolute;z-index:4;left:26px;bottom:26px;max-width:min(46vw,440px)}
  #say h1{margin:0;font-family:var(--disp);font-weight:600;letter-spacing:-.045em;line-height:1.1;
    font-size:clamp(22px,3.1vw,40px);text-wrap:balance}
  #say h1 em{font-family:var(--ital);font-style:italic;font-weight:400;letter-spacing:-.01em}
  #say p{margin:12px 0 0;font-size:11px;color:var(--faint);letter-spacing:.02em}
  #say b{font-variant-numeric:tabular-nums;color:var(--ink)}

  #total{position:absolute;z-index:4;right:26px;bottom:26px;text-align:right}
  #total b{display:block;font-family:var(--disp);font-weight:700;letter-spacing:-.05em;
    font-size:clamp(26px,3.4vw,42px);line-height:1;font-variant-numeric:tabular-nums}
  #total span{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}

  @media (max-width:900px){
    #card{inset:8px;border-radius:20px}
    #in{width:180px;left:14px;top:14px}
    .brief{font-size:10px;padding:7px 9px}
    #clock{top:14px;right:14px;gap:9px}
    #clock .face{width:54px;height:54px}
    #clock .t{font-size:16px}
    #out{width:190px;right:14px;top:88px;bottom:150px}
    .done .cap{font-size:10px}
    #say{left:14px;bottom:14px;max-width:calc(100% - 28px)}
    #total{right:14px;bottom:104px}
  }
  @media (prefers-reduced-motion:reduce){.brief,.done{animation:none}}
</style>

<div id="card">
  <div id="sky"></div>
  <div id="stage"></div>

  <div id="clock">
    <svg class="face" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="ring" cx="50" cy="50" r="46"/>
      <g class="tick">
        <line x1="50" y1="10" x2="50" y2="17"/><line x1="90" y1="50" x2="83" y2="50"/>
        <line x1="50" y1="90" x2="50" y2="83"/><line x1="10" y1="50" x2="17" y2="50"/>
      </g>
      <line class="hh" id="hh" x1="50" y1="50" x2="50" y2="27"/>
      <line class="mm" id="mm" x1="50" y1="50" x2="50" y2="17"/>
      <circle class="pin" cx="50" cy="50" r="2.6"/>
    </svg>
    <div class="meta"><div class="t" id="t-clock">00:00</div><div class="d" id="t-day">Day 1</div></div>
  </div>

  <section id="in">
    <div class="lbl">Landing on her</div>
    <div id="in-list"></div>
  </section>

  <section id="out">
    <div class="lbl">Shipped</div>
    <div id="out-list"></div>
  </section>

  <div id="say">
    <h1>She works <em>while you sleep</em></h1>
    <p>One social media manager, no shift she clocks out of. <b id="since">0</b> posts since midnight.</p>
  </div>

  <div id="total"><b id="t-total">0</b><span>Shipped in all</span></div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader}      from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {drawMark}        from './mark.js';

/* ------------------------------------------------ the day ---- */
const DAY_MS = 60000;                      // one whole day per real minute

/* hour -> sky, and how much daylight there is */
const SKY = [
  {h: 0,  a:'#180E2A', b:'#080512', d:0.00},
  {h: 4,  a:'#291442', b:'#120A24', d:0.00},
  {h: 6,  a:'#7C3A72', b:'#3A2146', d:0.14},
  {h: 8,  a:'#F79BCE', b:'#FCD05A', d:0.72},
  {h:12,  a:'#FCB4DE', b:'#FFE6A0', d:1.00},
  {h:16,  a:'#F79BCE', b:'#FCD05A', d:0.86},
  {h:19,  a:'#C76B9C', b:'#7A3A55', d:0.32},
  {h:21,  a:'#492450', b:'#1E1030', d:0.05},
  {h:24,  a:'#180E2A', b:'#080512', d:0.00},
];
const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const mix = (p, q, t) => p.map((v,i) => v + (q[i]-v)*t);
const css = c => `rgb(${c.map(v=>Math.round(v)).join(',')})`;
const rgba = (c,a) => `rgba(${c.map(v=>Math.round(v)).join(',')},${a})`;

function sky(hour){
  let i = 0; while (i < SKY.length-2 && hour >= SKY[i+1].h) i++;
  const A = SKY[i], B = SKY[i+1];
  const t = (hour - A.h) / (B.h - A.h);
  return {a: mix(hex(A.a), hex(B.a), t), b: mix(hex(A.b), hex(B.b), t), d: A.d + (B.d-A.d)*t};
}

const INK_DAY = hex('#3A1230'), INK_NIGHT = hex('#F7EFF8');
const root = document.documentElement, skyEl = document.getElementById('sky');

function paint(hour){
  const s = sky(hour);
  skyEl.style.background =
    `linear-gradient(168deg, ${css(s.a)} 0%, ${css(s.b)} 100%)`;
  // text flips over once there is real daylight, and holds through dawn and dusk
  const L = Math.min(1, Math.max(0, (s.d - 0.22) / 0.30));
  const ink = mix(INK_NIGHT, INK_DAY, L);
  root.style.setProperty('--ink',   css(ink));
  root.style.setProperty('--faint', rgba(ink, 0.5));
  root.style.setProperty('--hair',  rgba(ink, 0.17));
  root.style.setProperty('--panel', L > 0.5 ? `rgba(255,255,255,${0.44+0.24*L})`
                                            : `rgba(12,6,20,${0.50-0.12*L})`);
  return s;
}

/* ------------------------------------------------ the figure ---- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.NoToneMapping;
stage.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 20);
const pmrem  = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.05).texture;

const key  = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(0.34,0.40,0.32);
const warm = new THREE.DirectionalLight(0xFFC9E6, 0.7); warm.position.set(-0.42,0.14,0.18);
const hemi = new THREE.HemisphereLight(0xffffff, 0x2A0A22, 0.8);
const lamp = new THREE.DirectionalLight(0xBFD4FF, 0.0); lamp.position.set(0.5,0.05,0.5);
scene.add(key, warm, hemi, lamp);

const rig = new THREE.Group(); scene.add(rig);
const PIVOT = new THREE.Vector3(0, 0.070, 0);
const DIR   = new THREE.Vector3(0.84, 0.19, -0.50).normalize();

function frame(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w/h;
  const v  = camera.fov*Math.PI/180;
  const hf = 2*Math.atan(Math.tan(v/2)*camera.aspect);
  const dist = Math.max(((w>=900 ? 0.250 : 0.330)/2)/Math.tan(v/2), (0.105/2)/Math.tan(hf/2));
  camera.position.copy(PIVOT).addScaledVector(DIR, dist);
  camera.lookAt(PIVOT);
  camera.updateProjectionMatrix();
}
frame();

function badge(){
  const c = document.createElement('canvas'); c.width = c.height = 512;
  drawMark(c.getContext('2d'), 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const m = new THREE.Mesh(new THREE.CircleGeometry(0.0059, 64),
        new THREE.MeshStandardMaterial({map:t, roughness:.34, metalness:0, transparent:true}));
  m.rotation.y = Math.PI/2; m.position.set(0.01088, 0.0541, 0);
  return m;
}
function received(gltf){
  gltf.scene.traverse(o => {
    if (!o.isMesh) return;
    const list = Array.isArray(o.material) ? o.material : [o.material];
    const out = list.map(m => {
      m.metalness = 0; m.roughness = (m.name||'').includes('eye') ? 0.09 : 0.42;
      m.vertexColors = true; m.color.setRGB(1,1,1); return m;
    });
    o.material = out.length === 1 ? out[0] : out;
  });
  gltf.scene.add(badge());
  rig.add(gltf.scene);
}
const loader = new GLTFLoader();
if (window.SOSHIE_GLB){
  const bin = atob(window.SOSHIE_GLB), buf = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
  delete window.SOSHIE_GLB;
  loader.parse(buf.buffer, '', received);
} else loader.load('soshie-lite.glb', received);

/* ------------------------------------------------ the work ---- */
const WORK = [
 ['Announce the spring drop','New drop lands Tuesday. Same hands, better everything.','Scheduled · Tue 09:00'],
 ['A big account tagged us','Screenshotted, framed, and now the whole week is made.','Replied · 2 min'],
 ['Nobody watches our Reels','Hook in the first 1.2 seconds. Three cuts.','3 Reels drafted'],
 ['Turn the case study into posts','Six slides: the problem, the number, the fix.','Carousel · 6 slides'],
 ['What do we post Friday?','Behind the scenes. Friday is for faces, not products.','Queued · Fri 17:00'],
 ['This thread is heating up','Answered in public, receipts attached, tone kept warm.','Replied · 1 min'],
 ['We need a month of content','Twenty posts, four pillars, three formats.','Calendar · March'],
 ['Find what is trending','Three sounds under 50k uses. Two still climbing.','Trends · 3 found'],
 ['Captions all sound the same','Rewrote twelve. Cut every “excited to announce”.','12 rewritten'],
 ['Repurpose the newsletter','One thread, eight posts, zero new writing.','Thread · 8 posts'],
 ['DMs are piling up','Sorted: 14 buyers, 6 press, 40 bots shown the door.','Inbox cleared'],
 ['The launch post underperformed','Reposted at 18:40 with a sharper first line.','Reposted'],
 ['Comment section needs a human','Forty-one replies, none of them copy-paste.','41 replies'],
 ['Plan the giveaway','Entry in one tap. Winner picked Sunday, in public.','Giveaway live'],
];
const FROM = ['Inbox','Slack','A customer','Your co-founder','Instagram','The calendar','TikTok'];

const el = id => document.getElementById(id);
const inList = el('in-list'), outList = el('out-list');
let bag = [], queue = [], total = 0, since = 0, day = 1;

function pick(){
  if (!bag.length){ bag = WORK.map((_,i)=>i);
    for (let i=bag.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [bag[i],bag[j]]=[bag[j],bag[i]]; } }
  return WORK[bag.pop()];
}
function arrive(){
  if (queue.length >= 3) return;
  const [brief, caption, tag] = pick();
  const node = document.createElement('div');
  node.className = 'brief';
  node.innerHTML = `<div class="src">${FROM[(Math.random()*FROM.length)|0]}</div>${brief}`;
  const item = {node, caption, tag, age:0};
  node.addEventListener('pointerdown', () => take(item));   // nudge one along if you like
  inList.appendChild(node);
  queue.push(item);
}
function take(item){
  if (!queue.includes(item)) return;
  queue = queue.filter(q => q !== item);
  item.node.classList.add('go');
  setTimeout(() => item.node.remove(), 300);
  bump();
  setTimeout(() => ship(item), 420);
}
function ship(item){
  total++; since++;
  el('t-total').textContent = total;
  el('since').textContent = since;
  const d = document.createElement('div');
  d.className = 'done';
  d.innerHTML = `<div class="cap">${item.caption}</div><div class="tag"><i></i>${item.tag}</div>`;
  outList.prepend(d);
  while (outList.children.length > 7) outList.lastElementChild.remove();
}

let hop = null;
const bump = () => hop = 0;

/* ------------------------------------------------ run ---- */
const hh = el('hh'), mm = el('mm');
const start = performance.now();
let last = start, nextIn = 0.3, prevHour = 0;

renderer.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  const hour = ((now - start) % DAY_MS) / DAY_MS * 24;

  if (hour < prevHour){ day++; since = 0; el('t-day').textContent = 'Day ' + day;
    el('since').textContent = '0'; }
  prevHour = hour;

  const s = paint(hour);

  const H = Math.floor(hour), M = Math.floor((hour - H) * 60);
  el('t-clock').textContent = String(H).padStart(2,'0') + ':' + String(M).padStart(2,'0');
  hh.setAttribute('transform', `rotate(${(hour%12)/12*360} 50 50)`);
  mm.setAttribute('transform', `rotate(${(hour%1)*360} 50 50)`);

  // the sky lights the figure: bright and warm by day, dim and blue by night,
  // with a screen-coloured lamp on her face once it is dark
  key.intensity  = 0.30 + 2.10*s.d;
  key.color.setRGB(...mix([0.62,0.72,1.0], [1,1,1], s.d));
  warm.intensity = 0.10 + 0.70*s.d;
  hemi.intensity = 0.28 + 0.80*s.d;
  hemi.color.setRGB(s.a[0]/255, s.a[1]/255, s.a[2]/255);
  hemi.groundColor.setRGB(s.b[0]/255, s.b[1]/255, s.b[2]/255);
  scene.environmentIntensity = 0.16 + 0.42*s.d;
  lamp.intensity = 0.85 * (1 - Math.min(1, s.d/0.5));

  nextIn -= dt;
  if (nextIn <= 0){ arrive(); nextIn = 0.55 + Math.random()*0.5; }
  for (const q of [...queue]){ q.age += dt; if (q.age > 1.15) take(q); }

  const t = now/1000;
  rig.rotation.y = Math.sin(t*0.4)*0.18;
  rig.position.y = Math.sin(t*1.05)*0.0016;
  if (hop !== null){
    hop += dt;
    const k = Math.max(0, 1 - hop/0.4);
    rig.position.y += Math.abs(Math.sin(hop*15))*0.005*k;
    if (hop > 0.4) hop = null;
  }
  renderer.render(scene, camera);
});
addEventListener('resize', frame);
</script>
