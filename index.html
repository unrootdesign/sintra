<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soshie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;400;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    --outer:#EFEDEE; --edge:rgba(0,0,0,.06);
    /* driven from JS as the day turns */
    --ink:#FFFFFF; --panel:rgba(6,12,26,.56); --hair:rgba(255,255,255,.19);
    --faint:rgba(255,255,255,.58); --scrimRGB:20,82,143;
    --tick:#4FE0A8;
    --c-rim:.10; --c-dot:.13; --c-pip:.12; --c-q:.18; --c-hh:.26; --c-mm:.18;
    --disp:"Martian Mono",ui-monospace,monospace;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
    --focal:50%;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--outer:#0B0609;--edge:rgba(255,255,255,.07)}}
  :root[data-theme="dark"]{--outer:#0B0609;--edge:rgba(255,255,255,.07)}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--outer);color:var(--ink);font-family:var(--mono);
    overflow:hidden;-webkit-user-select:none;user-select:none}

  #card{position:fixed;inset:13px;border-radius:26px;overflow:hidden;
    background:#2A4A6E;cursor:crosshair}
  #sky{position:absolute;inset:0;z-index:0}
  #card::before{content:"";position:absolute;left:0;right:0;top:0;height:150px;z-index:3;
    pointer-events:none;
    background:linear-gradient(180deg,rgba(5,10,20,.40) 0%,rgba(5,10,20,0) 100%)}

  /* the clock lives behind her, like something on the wall */
  #wall{position:absolute;z-index:1;left:var(--focal);top:48%;transform:translate(-50%,-50%);
    width:min(86vh,680px);aspect-ratio:1;pointer-events:none;
    filter:drop-shadow(0 0 4px rgba(255,255,255,.30))
           drop-shadow(0 0 26px rgba(255,255,255,.24))}
  #wall .rim{fill:none;stroke:#fff;stroke-opacity:var(--c-rim);stroke-width:.13}
  #wall .pip{stroke:#fff;stroke-opacity:var(--c-pip);stroke-width:.14;stroke-linecap:round}
  #wall .pip.q{stroke-opacity:var(--c-q);stroke-width:.30}
  #wall .dot{stroke-opacity:var(--c-dot);stroke-dasharray:.14 1.5;stroke-linecap:round}
  #wall .hh{stroke:#fff;stroke-opacity:var(--c-hh);stroke-width:.42;stroke-linecap:round}
  #wall .mm{stroke:#fff;stroke-opacity:var(--c-mm);stroke-width:.26;stroke-linecap:round}
  #wall .pin{fill:#fff;fill-opacity:var(--c-hh)}

  #stage{position:absolute;inset:0;z-index:2}
  /* one full-width veil in the current sky colour; the stops approximate an ease
     so the gradient has no edge you can pick out */
  /* 8-bit gradients band; a little noise over everything dithers it away */
  #grain{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;
    opacity:.075;mix-blend-mode:overlay}
  #veil{position:absolute;left:0;right:0;bottom:0;height:58%;z-index:3;pointer-events:none;
    background:linear-gradient(to top,
      rgba(var(--scrimRGB),.92) 0%,   rgba(var(--scrimRGB),.86) 10%,
      rgba(var(--scrimRGB),.72) 22%,  rgba(var(--scrimRGB),.54) 36%,
      rgba(var(--scrimRGB),.36) 50%,  rgba(var(--scrimRGB),.20) 64%,
      rgba(var(--scrimRGB),.09) 78%,  rgba(var(--scrimRGB),.03) 90%,
      rgba(var(--scrimRGB),0)   100%)}
  canvas{display:block}

  #now{position:absolute;z-index:4;top:24px;left:26px}
  #total{position:absolute;z-index:4;top:24px;right:26px;text-align:right}
  /* both running figures are set identically, so neither reads as the bigger one */
  .fig{font-family:var(--disp);font-weight:700;font-size:clamp(21px,2.6vw,31px);
    letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
  .sub{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
    margin-top:5px}

  #out{position:absolute;z-index:4;right:26px;top:76px;bottom:0;width:300px;overflow:hidden;
    mask-image:linear-gradient(180deg,transparent 0,#000 58px,
      #000 calc(100% - 26px),transparent 100%);
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 58px,
      #000 calc(100% - 26px),transparent 100%)}
  .lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
    margin-bottom:10px}
  #out-list{position:absolute;left:0;right:0;bottom:34px;
    display:flex;flex-direction:column;gap:7px}
  .done{position:relative;overflow:hidden;background:#FBFCFD;color:#15181D;border-radius:12px;
    padding:10px 12px;flex:0 0 auto;box-shadow:0 6px 18px -10px rgba(3,10,22,.55);
    animation:pop .38s cubic-bezier(.2,.9,.3,1.15)}
  /* the job fills its own card while it runs, then the green drains away */
  .done .fill{position:absolute;left:0;top:0;bottom:0;width:0;
    background:linear-gradient(90deg,rgba(28,214,140,.20),rgba(28,214,140,.44));
    box-shadow:1.5px 0 0 rgba(24,206,132,.85);transition:opacity .55s .12s}
  .done:not(.working) .fill{opacity:0}
  .done .cap,.done .tag{position:relative}
  .done .cap{font-size:11.5px;line-height:1.38}
  .done .tag{margin-top:6px;font-size:8px;letter-spacing:.12em;text-transform:uppercase;
    color:rgba(21,24,29,.52);display:flex;align-items:center;gap:6px}
  .done .tag i{width:5px;height:5px;border-radius:50%;background:var(--tick);display:block;
    flex:0 0 auto;transition:background .3s}
  .done.working .tag{color:rgba(21,24,29,.38)}
  .done.working .tag i{background:rgba(21,24,29,.20)}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}

  #say{position:absolute;z-index:4;left:26px;bottom:26px;max-width:min(50vw,520px)}

  #say h1{margin:0;font-family:var(--disp);font-weight:300;letter-spacing:-.045em;line-height:1.12;max-width:12ch;
    font-size:clamp(21px,3vw,38px);text-wrap:balance}
  #say p{margin:12px 0 0;font-size:11px;color:var(--faint);letter-spacing:.02em;line-height:1.72}
  #say b{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}


  @media (max-width:900px){
    :root{--focal:50%}
    #card{inset:8px;border-radius:20px}
    #wall{width:min(42vh,320px);top:38%}
    #now{top:14px;right:14px}
    #out{width:186px;right:14px;top:72px;bottom:0}
    .done .cap{font-size:10px}
    #say{left:14px;bottom:14px;max-width:calc(100% - 28px)}
    #total{right:14px;bottom:108px}
  }
  @media (prefers-reduced-motion:reduce){.done{animation:none}}
</style>

<div id="card">
  <div id="sky"></div>
  <div id="veil"></div>
  <canvas id="grain"></canvas>

  <svg id="wall" viewBox="0 0 100 100" aria-hidden="true">
    <circle class="rim" cx="50" cy="50" r="47"/>
    <circle class="rim dot" cx="50" cy="50" r="44.2"/>
    <g id="pips"></g>
    <line class="hh" id="hh" x1="50" y1="50" x2="50" y2="28"/>
    <line class="mm" id="mm" x1="50" y1="50" x2="50" y2="15"/>
    <circle class="pin" cx="50" cy="50" r="0.8"/>
  </svg>

  <div id="stage"></div>

  <div id="now">
    <div class="fig" id="t-clock">00:00</div>
    <div class="sub" id="t-day">Day 1</div>
  </div>

  <div id="total">
    <div class="fig" id="t-total">0</div>
    <div class="sub">Shipped</div>
  </div>

  <section id="out">
    <div id="out-list"></div>
  </section>

  <div id="say">
    <h1>Soshie works while you sleep</h1>
    <p>One social media manager, no shift she clocks out of.<br>
       Nothing sits in the queue waiting for morning.</p>
  </div>

</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader}      from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {drawMark}        from './mark.js';

const el = id => document.getElementById(id);
const DAY_MS = 24000;                       // a whole day every 24 seconds

/* ---- clock face ---- */
{ const g = el('pips');
  for (let i = 0; i < 12; i++){
    const a = i/12*Math.PI*2, q = i % 3 === 0;
    const r1 = q ? 37.4 : 39.6, r2 = 41.8;
    const l = document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1', 50+Math.sin(a)*r1); l.setAttribute('y1', 50-Math.cos(a)*r1);
    l.setAttribute('x2', 50+Math.sin(a)*r2); l.setAttribute('y2', 50-Math.cos(a)*r2);
    l.setAttribute('class', 'pip' + (q ? ' q' : ''));
    g.appendChild(l);
  } }

/* ---- sky ---- */
const SKY = [
  {h: 0,   a:'#241634', m:'#130C1E', b:'#060409', d:0.00},
  {h: 3,   a:'#1C0F28', m:'#0E0817', b:'#050308', d:0.00},
  {h: 5,   a:'#35254E', m:'#1B1430', b:'#0A0814', d:0.03},
  {h: 6.5, a:'#7A6490', m:'#3E3252', b:'#17121F', d:0.15},
  {h: 8,   a:'#9CE0FF', m:'#1F84E2', b:'#0B3C77', d:0.70},
  {h:12,   a:'#AEEAFF', m:'#268FEC', b:'#0D4489', d:1.00},
  {h:16,   a:'#9DE1FF', m:'#2086E3', b:'#0B3D78', d:0.86},
  {h:18.5, a:'#A0748E', m:'#56374F', b:'#201426', d:0.30},
  {h:20.5, a:'#40233C', m:'#22132A', b:'#0C0812', d:0.05},
  {h:24,   a:'#241634', m:'#130C1E', b:'#060409', d:0.00},
];
const hex  = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const mix  = (p,q,t) => p.map((v,i) => v + (q[i]-v)*t);
const css  = c => `rgb(${c.map(v=>Math.round(v)).join(',')})`;
const rgba = (c,a) => `rgba(${c.map(v=>Math.round(v)).join(',')},${a})`;
function sky(hour){
  let i = 0; while (i < SKY.length-2 && hour >= SKY[i+1].h) i++;
  const A = SKY[i], B = SKY[i+1];
  let t = (hour-A.h)/(B.h-A.h);
  t = t*t*(3-2*t);                       // ease each leg so no stop reads as a step
  return {a: mix(hex(A.a),hex(B.a),t), m: mix(hex(A.m),hex(B.m),t),
          b: mix(hex(A.b),hex(B.b),t), d: A.d+(B.d-A.d)*t};
}
const root = document.documentElement, skyEl = el('sky');
function paint(hour){
  const s = sky(hour);
  skyEl.style.background =
    `linear-gradient(176deg, ${css(s.a)} 0%, ${css(s.m)} 42%, ${css(s.b)} 100%)`;
  root.style.setProperty('--scrimRGB', s.b.map(v=>Math.round(v)).join(','));
  root.style.setProperty('--c-rim', (0.09 + 0.13*s.d).toFixed(3));
  root.style.setProperty('--c-dot', (0.11 + 0.16*s.d).toFixed(3));
  root.style.setProperty('--c-pip', (0.10 + 0.14*s.d).toFixed(3));
  root.style.setProperty('--c-q',   (0.16 + 0.20*s.d).toFixed(3));
  root.style.setProperty('--c-hh',  (0.24 + 0.24*s.d).toFixed(3));
  root.style.setProperty('--c-mm',  (0.16 + 0.20*s.d).toFixed(3));
  return s;
}

/* ---- scene ---- */
{ // one noise tile, painted across a canvas that sits above the gradients
  const grain = el('grain'), g = grain.getContext('2d');
  const tile = document.createElement('canvas'); tile.width = tile.height = 128;
  const tg = tile.getContext('2d'), img = tg.createImageData(128, 128);
  for (let i = 0; i < img.data.length; i += 4){
    const v = 90 + ((Math.random() * 76) | 0);
    img.data[i] = img.data[i+1] = img.data[i+2] = v; img.data[i+3] = 255;
  }
  tg.putImageData(img, 0, 0);
  const paintGrain = () => {
    grain.width = grain.clientWidth; grain.height = grain.clientHeight;
    g.fillStyle = g.createPattern(tile, 'repeat');
    g.fillRect(0, 0, grain.width, grain.height);
  };
  paintGrain();
  addEventListener('resize', paintGrain);
}

const stage = el('stage');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.NoToneMapping;
stage.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, 1, 0.01, 20);
const pmrem  = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.02).texture;

const key  = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(0.34,0.40,0.32);
const warm = new THREE.DirectionalLight(0xFFC9E6, 0.7); warm.position.set(-0.42,0.14,0.18);
const hemi = new THREE.HemisphereLight(0xffffff, 0x2A0A22, 0.8);
const lamp = new THREE.DirectionalLight(0xBFD4FF, 0.0); lamp.position.set(0.5,0.05,0.5);
scene.add(key, warm, hemi, lamp);

const rig = new THREE.Group(); scene.add(rig);
let head = null, armL = null, armR = null;
const lids = [];          // {lid, lash} — one per eye

/* framed on the head, with the tops of the arms in shot */
const PIVOT = new THREE.Vector3(0, 0.0985, 0);
const DIR   = new THREE.Vector3(1.0, 0.045, 0.0).normalize();
function frame(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w/h;
  const v  = camera.fov*Math.PI/180;
  const hf = 2*Math.atan(Math.tan(v/2)*camera.aspect);
  const dist = Math.max(((w>=900?0.140:0.172)/2)/Math.tan(v/2), (0.082/2)/Math.tan(hf/2));
  camera.position.copy(PIVOT).addScaledVector(DIR, dist);
  camera.lookAt(PIVOT);
  camera.updateProjectionMatrix();
}
frame();

function badge(){
  const c = document.createElement('canvas'); c.width = c.height = 512;
  drawMark(c.getContext('2d'), 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const m = new THREE.Mesh(new THREE.CircleGeometry(0.0059, 64),
        new THREE.MeshStandardMaterial({map:t, roughness:.34, metalness:0, transparent:true}));
  m.rotation.y = Math.PI/2; m.position.set(0.01088, 0.0541, 0);
  return m;
}
/* There are no eyelids in this model: the eyes are 14 mm spheres poking through
   sockets. So each lid is a skin-coloured cap swung on the eyeball's own centre,
   and the lash — its own node now — rides the same hinge through the same arc. */
const EYE_R = 0.00722;                       // a hair proud of the 7 mm eyeball
const EYES  = [                              // glTF is Y-up: Blender (x,y,z) -> (x,z,-y)
  {x: 0.0142, y: 0.0903, z: -0.00755, lash: 'LashL'},
  {x: 0.0142, y: 0.0903, z:  0.00755, lash: 'LashR'},
];
const LID_OPEN = 0.524, LID_SHUT = -1.047;   // cap axis, 120deg to 30deg above the gaze

function buildLids(root){
  const skin = new THREE.MeshStandardMaterial({color:new THREE.Color('#F8D8C2'),
                roughness:0.42, metalness:0});
  const cap = new THREE.SphereGeometry(EYE_R, 28, 14, 0, Math.PI*2, 0, 1.309); // 75deg cap
  for (const e of EYES){
    const hinge = new THREE.Group();
    hinge.position.set(e.x, e.y, e.z);
    hinge.rotation.z = LID_OPEN;
    hinge.add(new THREE.Mesh(cap, skin));
    root.add(hinge);
    head.attach(hinge);                      // keeps world placement, follows the head
    const lash = root.getObjectByName(e.lash);
    if (lash) head.attach(lash);
    lids.push({hinge, lash});
  }
}

function received(gltf){
  gltf.scene.traverse(o => {
    if (!o.isMesh) return;
    const list = Array.isArray(o.material) ? o.material : [o.material];
    const out = list.map(m => {
      m.metalness = 0; m.roughness = (m.name||'').includes('eye') ? 0.09 : 0.42;
      m.vertexColors = true; m.color.setRGB(1,1,1); return m;
    });
    o.material = out.length === 1 ? out[0] : out;
  });
  head = gltf.scene.getObjectByName('Head');
  armL = gltf.scene.getObjectByName('ArmL');
  armR = gltf.scene.getObjectByName('ArmR');
  buildLids(gltf.scene);
  const body = gltf.scene.getObjectByName('Body');
  (body || gltf.scene).add(badge());
  rig.add(gltf.scene);
}
const loader = new GLTFLoader();
if (window.SOSHIE_GLB){
  const bin = atob(window.SOSHIE_GLB), buf = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
  delete window.SOSHIE_GLB;
  loader.parse(buf.buffer, '', received);
} else loader.load('soshie.glb', received);

/* blink: quick down, a beat shut, slower up — and now and then a second one */
let blinkAmt = 0, blinkT = -1, nextBlink = 1.6 + Math.random()*3;
function stepBlink(dt){
  if (blinkT < 0){
    nextBlink -= dt;
    if (nextBlink <= 0) blinkT = 0;
  } else {
    blinkT += dt;
    const DOWN = 0.085, SHUT = 0.045, UP = 0.135;
    if (blinkT < DOWN)              blinkAmt = 1 - (1 - blinkT/DOWN)**2;
    else if (blinkT < DOWN+SHUT)    blinkAmt = 1;
    else if (blinkT < DOWN+SHUT+UP) blinkAmt = ((DOWN+SHUT+UP - blinkT)/UP)**1.6;
    else {
      blinkAmt = 0; blinkT = -1;
      nextBlink = Math.random() < 0.24 ? 0.20 : 2.2 + Math.random()*3.8;
    }
  }
  for (const {hinge, lash} of lids){
    hinge.rotation.z = LID_OPEN + (LID_SHUT - LID_OPEN) * blinkAmt;
    if (lash) lash.rotation.z = (LID_SHUT - LID_OPEN) * blinkAmt;
  }
}

/* ---- she watches the pointer ---- */
let px = 0, py = 0, follow = 0, lastMove = -1e9;
el('card').addEventListener('pointermove', e => {
  const r = el('card').getBoundingClientRect();
  px = ((e.clientX - r.left)/r.width)*2 - 1;
  py = ((e.clientY - r.top)/r.height)*2 - 1;
  lastMove = performance.now();
});

/* ---- the work ---- */
const WORK = [
 ['New drop lands Tuesday. Same hands, better everything.','Scheduled · Tue 09:00'],
 ['Screenshotted, framed, and now the whole week is made.','Replied · 2 min'],
 ['Hook in the first 1.2 seconds. Three cuts.','3 Reels drafted'],
 ['Six slides: the problem, the number, the fix.','Carousel · 6 slides'],
 ['Behind the scenes. Friday is for faces, not products.','Queued · Fri 17:00'],
 ['Answered in public, receipts attached, tone kept warm.','Replied · 1 min'],
 ['Twenty posts, four pillars, three formats.','Calendar · March'],
 ['Three sounds under 50k uses. Two still climbing.','Trends · 3 found'],
 ['Rewrote twelve. Cut every “excited to announce”.','12 rewritten'],
 ['One thread, eight posts, zero new writing.','Thread · 8 posts'],
 ['Sorted: 14 buyers, 6 press, 40 bots shown the door.','Inbox cleared'],
 ['Reposted at 18:40 with a sharper first line.','Reposted'],
 ['Forty-one replies, none of them copy-paste.','41 replies'],
 ['Entry in one tap. Winner picked Sunday, in public.','Giveaway live'],
];
const outList = el('out-list');
let bag = [], lastIdx = -1, total = 0, day = 1;
let task = null, nextAt = -1;

function startTask(now){
  if (!bag.length){ bag = WORK.map((_,i)=>i);
    for (let i=bag.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [bag[i],bag[j]]=[bag[j],bag[i]]; } }
  // don't draw anything that is still on screen, not just the one before
  const onScreen = new Set([...outList.children].map(c => c.dataset.i));
  let idx = bag.pop(), skipped = [];
  while ((idx === lastIdx || onScreen.has(String(idx))) && bag.length){
    skipped.push(idx); idx = bag.pop();
  }
  bag.push(...skipped);
  lastIdx = idx;
  const [cap, tag] = WORK[idx];

  const d = document.createElement('div');
  d.className = 'done working';
  d.dataset.i = idx;
  d.innerHTML = `<div class="fill"></div><div class="cap">${cap}</div>` +
                `<div class="tag"><i></i>${tag}</div>`;
  outList.appendChild(d);
  while (outList.children.length > 9) outList.firstElementChild.remove();

  // the newest card holds the bottom slot; the column grows upward past it
  const step = d.offsetHeight + 7;
  d.style.marginTop = -step + 'px';
  requestAnimationFrame(() => {
    d.style.transition = 'margin-top .44s cubic-bezier(.25,.9,.3,1)';
    d.style.marginTop  = '0px';
  });

  // each job takes its own time — enough spread to notice, not enough to look broken
  task = {node:d, fill:d.querySelector('.fill'), start:now, dur:820 + Math.random()*950};
}

function landTask(now){
  task.fill.style.width = '100%';
  task.node.classList.remove('working');
  total++;
  el('t-total').textContent = total;
  task = null;
  nextAt = now + 60 + Math.random()*110;
}

/* ---- run ---- */
const hh = el('hh'), mm = el('mm');
const start = performance.now();
let last = start, prevHour = 0;

renderer.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  const t = now/1000;
  const hour = ((now - start) % DAY_MS) / DAY_MS * 24;

  if (hour < prevHour){ day++; el('t-day').textContent = 'Day ' + day; }
  prevHour = hour;

  const s = paint(hour);
  const H = Math.floor(hour), M = Math.floor((hour-H)*60);
  el('t-clock').textContent = String(H).padStart(2,'0') + ':' + String(M).padStart(2,'0');
  hh.setAttribute('transform', `rotate(${(hour%12)/12*360} 50 50)`);
  mm.setAttribute('transform', `rotate(${(hour%1)*360} 50 50)`);

  key.intensity  = 0.10 + 2.55*s.d;
  key.color.setRGB(...mix([0.55,0.66,1.0],[1,0.99,0.97], s.d));
  warm.intensity = 0.03 + 0.70*s.d;
  hemi.intensity = 0.10 + 1.05*s.d;
  hemi.color.setRGB(s.a[0]/255, s.a[1]/255, s.a[2]/255);
  hemi.groundColor.setRGB(s.b[0]/255, s.b[1]/255, s.b[2]/255);
  scene.environmentIntensity = 0.05 + 0.55*s.d;
  lamp.intensity = 0.40 * (1 - Math.min(1, s.d/0.5));   // just enough to keep her readable

  if (task){
    const p = Math.min(1, (now - task.start) / task.dur);
    task.fill.style.width = (p*100).toFixed(1) + '%';
    if (p >= 1) landTask(now);
  } else if (nextAt < 0){
    nextAt = now + 120;
  } else if (now >= nextAt){
    startTask(now);
  }

  // head: the pointer when there is one, a slow look around when there is not
  const want = (now - lastMove < 2400) ? 1 : 0;
  follow += (want - follow) * Math.min(1, dt*2.2);
  if (head){
    const idleY = Math.sin(t*0.31)*0.20 + Math.sin(t*0.17+1.3)*0.10;
    const idleP = Math.sin(t*0.23+0.7)*0.055;
    const yaw   = idleY + ( px*0.52 - idleY) * follow;
    const pitch = idleP + (-py*0.10 - idleP) * follow;
    head.rotation.y += (yaw   - head.rotation.y) * Math.min(1, dt*1.7);
    head.rotation.z += (pitch - head.rotation.z) * Math.min(1, dt*1.7);
  }
  // arms: small, uneven, the way someone shifts while standing
  if (armL && armR){
    armL.rotation.z = Math.sin(t*0.61)*0.055 + Math.sin(t*0.23+2.1)*0.035;
    armR.rotation.z = Math.sin(t*0.54+1.7)*0.050 + Math.sin(t*0.19+0.4)*0.030;
    armL.rotation.x =  Math.sin(t*0.37+0.8)*0.030;
    armR.rotation.x = -Math.sin(t*0.33+2.4)*0.028;
  }
  if (lids.length) stepBlink(dt);
  rig.position.y = Math.sin(t*0.9)*0.0009;        // breath, not a bounce

  renderer.render(scene, camera);
});
addEventListener('resize', frame);
</script>
