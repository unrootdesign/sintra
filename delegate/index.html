<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hand It To Soshie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&family=Fraunces:ital,opsz,wght@1,9..144,400&display=swap">
<style>
  :root{
    --outer:#EFEDEE; --edge:rgba(0,0,0,.06);
    --ink:#FBF4F8; --dim:rgba(251,244,248,.60); --faint:rgba(251,244,248,.30);
    --hair:rgba(251,244,248,.16); --glass:rgba(10,4,9,.55);
    --pink:#F79BCE; --lav:#A87DEC; --peri:#A7BCF5; --mint:#8BE0C2;
    --disp:"Martian Mono",ui-monospace,monospace;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
    --ital:"Fraunces",Georgia,serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--outer:#0B0609;--edge:rgba(255,255,255,.07)}}
  :root[data-theme="dark"]{--outer:#0B0609;--edge:rgba(255,255,255,.07)}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--outer);color:var(--ink);font-family:var(--mono);
    overflow:hidden;-webkit-user-select:none;user-select:none}

  #card{position:fixed;inset:13px;border-radius:26px;overflow:hidden;border:1px solid var(--edge);
    background:radial-gradient(125% 95% at 50% -12%,#5A1749 0%,#2E0B26 46%,#130511 100%)}
  #stage{position:absolute;inset:0;z-index:0}
  canvas{display:block}

  /* ---- chrome ---- */
  #nav{position:absolute;z-index:5;top:20px;left:22px}
  #nav ul{margin:0;padding:6px 8px;list-style:none;display:flex;gap:2px;align-items:center;
    background:var(--glass);border:1px solid var(--hair);border-radius:999px;backdrop-filter:blur(14px)}
  #nav .mark{width:22px;height:22px;border-radius:50%;margin:0 4px 0 2px}
  #nav a{color:var(--dim);text-decoration:none;font-size:11px;padding:5px 10px;border-radius:999px;
    transition:.15s}
  #nav a:hover,#nav a[aria-current]{color:var(--ink);background:rgba(255,255,255,.09)}
  a:focus-visible,.brief:focus-visible{outline:2px solid var(--pink);outline-offset:3px}

  #score{position:absolute;z-index:5;top:20px;right:22px;display:flex;gap:7px}
  .tile{background:var(--glass);border:1px solid var(--hair);border-radius:14px;padding:8px 14px;
    text-align:right;backdrop-filter:blur(14px)}
  .tile b{display:block;font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:-.04em;
    line-height:1.15;font-variant-numeric:tabular-nums}
  .tile span{font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}

  .colhead{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
  .colhead.busy{color:var(--pink)}

  /* ---- incoming briefs ---- */
  #in{position:absolute;z-index:4;left:26px;top:78px;width:268px}
  #in-list{display:flex;flex-direction:column;gap:8px}
  .brief{background:var(--glass);border:1px solid var(--hair);border-radius:14px;padding:12px 14px;
    cursor:grab;touch-action:none;backdrop-filter:blur(14px);
    animation:slidein .34s cubic-bezier(.2,.9,.3,1.15)}
  .brief:hover{border-color:rgba(255,255,255,.4)}
  .brief .src{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .brief .txt{font-size:12.5px;line-height:1.42;margin-top:5px}
  .brief.drag{position:fixed;z-index:20;width:268px;cursor:grabbing;pointer-events:none;
    transform:rotate(-1.6deg);border-color:var(--pink);
    box-shadow:0 20px 44px -16px rgba(0,0,0,.7)}
  .brief.leaving{animation:fly .34s ease-in forwards}
  @keyframes slidein{from{opacity:0;transform:translateX(-22px)}}
  @keyframes fly{to{opacity:0;transform:translateX(120px) scale(.86)}}

  /* ---- the drop target ---- */
  #drop{position:absolute;z-index:1;left:50%;top:52%;width:290px;height:330px;
    transform:translate(-50%,-50%);border-radius:50%;border:1.5px dashed transparent;
    transition:border-color .18s,background .18s}
  #drop.armed{border-color:rgba(247,155,206,.55);background:rgba(247,155,206,.07)}
  #drop.hit{border-color:var(--pink);background:rgba(247,155,206,.16)}
  #busy{position:absolute;z-index:4;left:50%;top:calc(52% + 176px);transform:translateX(-50%);
    font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--pink);opacity:0;
    transition:opacity .2s;white-space:nowrap}
  #busy.on{opacity:1}

  /* ---- shipped ---- */
  #out{position:absolute;z-index:4;right:26px;top:78px;width:290px}
  #out-list{display:flex;flex-direction:column;gap:8px}
  .done{background:rgba(251,244,248,.96);color:#1B0718;border-radius:14px;padding:12px 14px;
    animation:pop .42s cubic-bezier(.2,.9,.3,1.2)}
  .done .cap{font-size:12.5px;line-height:1.42}
  .done .tag{margin-top:8px;padding-top:8px;border-top:1px solid rgba(27,7,24,.14);
    font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(27,7,24,.52);
    display:flex;align-items:center;gap:6px}
  .done .tag i{width:6px;height:6px;border-radius:50%;background:#2BA97F;display:block}
  @keyframes pop{from{opacity:0;transform:translateX(26px) scale(.94)}}

  #hint{position:absolute;z-index:5;left:26px;bottom:22px;font-size:10.5px;color:var(--dim);
    display:flex;align-items:center;gap:8px}
  #hint em{font-family:var(--ital);font-size:14px;color:var(--ink)}
  #hint .k{border:1px solid var(--hair);border-radius:6px;padding:2px 7px;font-size:9px;
    letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}

  @media (max-width:1040px){
    #in,#out{width:240px}
    #out{width:250px}
    #drop{width:230px}
  }
  @media (max-width:860px){
    #card{inset:8px;border-radius:20px}
    #in{left:14px;right:14px;width:auto;top:70px}
    #in-list{flex-direction:row;overflow-x:auto;padding-bottom:4px}
    .brief{min-width:200px;flex:0 0 auto}
    .brief.drag{width:200px}
    #out{left:14px;right:14px;width:auto;top:auto;bottom:58px}
    #out-list{flex-direction:row;overflow-x:auto}
    .done{min-width:210px;flex:0 0 auto}
    #drop{top:50%;height:220px}
    #busy{top:calc(50% + 120px)}
    #hint{bottom:16px;left:14px;font-size:9.5px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="card">
  <div id="stage"></div>
  <div id="drop"></div>

  <nav id="nav">
    <ul>
      <li><canvas class="mark" id="mark" width="64" height="64"></canvas></li>
      <li><a href="../">Model</a></li>
      <li><a href="./" aria-current="page">Game</a></li>
      <li><a href="https://github.com/unrootdesign/sintra">Source</a></li>
    </ul>
  </nav>

  <div id="score">
    <div class="tile"><b id="s-done">0</b><span>Shipped</span></div>
    <div class="tile"><b id="s-hours">0.0h</b><span>Not your work</span></div>
  </div>

  <section id="in">
    <div class="colhead" id="in-head"><span>Landing on you</span><span id="in-n">0</span></div>
    <div id="in-list"></div>
  </section>

  <section id="out">
    <div class="colhead"><span>Soshie shipped</span><span>Social media</span></div>
    <div id="out-list"></div>
  </section>

  <div id="busy">working…</div>

  <div id="hint">Drag a brief onto her — or just click it. <em>She takes it from there.</em></div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader}      from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

/* ---------------------------------------------- the work ---- */
const WORK = [
 ['Announce the spring drop',        'New drop lands Tuesday. Same hands, better everything.', 'Scheduled · Tue 09:00'],
 ['A big account just tagged us',    'Screenshotted, framed, and now our whole week is made.', 'Replied · 2 min'],
 ['Nobody watches our Reels',        'Hook in the first 1.2 seconds. Three cuts. Caption on frame one.', '3 Reels drafted'],
 ['Turn the case study into posts',  'Six slides: the problem, the number, the fix.', 'Carousel · 6 slides'],
 ['What do we post on Friday?',      'Behind the scenes. Friday is for faces, not products.', 'Queued · Fri 17:00'],
 ['This comment thread is heating up','Answered in public, receipts attached, tone kept warm.', 'Replied · 1 min'],
 ['We need a month of content',      'Twenty posts, four pillars, three formats.', 'Calendar · March'],
 ['Find what is trending for us',    'Three sounds under 50k uses. Two still climbing.', 'Trends · 3 found'],
 ['Our captions all sound the same', 'Rewrote twelve. Cut every “excited to announce”.', '12 rewritten'],
 ['Repurpose the newsletter',        'One thread, eight posts, zero new writing.', 'Thread · 8 posts'],
];
const FROM = ['Inbox','Slack','A customer','Your co-founder','Instagram','The calendar'];

/* ---------------------------------------------- the mark ---- */
function drawMark(x, S){
  const s = S/512;
  x.clearRect(0,0,S,S);
  x.fillStyle='#fff'; x.beginPath(); x.arc(256*s,256*s,232*s,0,Math.PI*2); x.fill();
  const L=56*s, T=140*s, k=(400/300)*s;
  const R=(X,Y,W,H)=>{x.beginPath();x.roundRect(L+X*k,T+Y*k,W*k,H*k,7*s);x.fill();};
  x.fillStyle='#141414';
  R(0,0,100,50); R(0,68,100,107); R(145,0,155,175);
  x.fillStyle='#fff';
  x.beginPath(); x.roundRect(L+200*k,T+58*k,44*k,140*k,[20*s,20*s,0,0]); x.fill();
}
drawMark(document.getElementById('mark').getContext('2d'), 64);

/* ---------------------------------------------- 3D ---- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.NoToneMapping;
stage.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 20);
const pmrem  = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.05).texture;
scene.environmentIntensity = 0.5;

const key = new THREE.DirectionalLight(0xffffff, 2.3);
key.position.set(0.34, 0.40, 0.32); scene.add(key);
const warm = new THREE.DirectionalLight(0xFFC9E6, 0.75);
warm.position.set(-0.42, 0.14, 0.18); scene.add(warm);
const cool = new THREE.DirectionalLight(0x9DB4FF, 0.55);
cool.position.set(0.10, -0.22, -0.40); scene.add(cool);
scene.add(new THREE.HemisphereLight(0xF6E4FF, 0x2A0A22, 0.85));

const rig = new THREE.Group(); scene.add(rig);
const PIVOT = new THREE.Vector3(0, 0.070, 0);
const DIR   = new THREE.Vector3(0.84, 0.19, -0.50).normalize();

function frame(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w/h;
  const v  = camera.fov*Math.PI/180;
  const hf = 2*Math.atan(Math.tan(v/2)*camera.aspect);
  const dist = Math.max(((w>=860 ? 0.255 : 0.330)/2)/Math.tan(v/2), (0.105/2)/Math.tan(hf/2));
  camera.position.copy(PIVOT).addScaledVector(DIR, dist);
  camera.lookAt(PIVOT);
  camera.updateProjectionMatrix();
}
frame();

function badge(){
  const c = document.createElement('canvas'); c.width = c.height = 512;
  drawMark(c.getContext('2d'), 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const m = new THREE.Mesh(new THREE.CircleGeometry(0.0059, 64),
        new THREE.MeshStandardMaterial({map:t, roughness:.34, metalness:0, transparent:true}));
  m.rotation.y = Math.PI/2; m.position.set(0.01088, 0.0541, 0);
  return m;
}

function received(gltf){
  gltf.scene.traverse(o=>{
    if(!o.isMesh) return;
    const list = Array.isArray(o.material)?o.material:[o.material];
    const out = list.map(m=>{
      m.metalness=0; m.roughness=(m.name||'').includes('eye')?0.09:0.42;
      m.vertexColors=true; m.color.setRGB(1,1,1); return m;
    });
    o.material = out.length===1?out[0]:out;
  });
  gltf.scene.add(badge());
  rig.add(gltf.scene);
}
const loader = new GLTFLoader();
if (window.SOSHIE_GLB){
  const bin=atob(window.SOSHIE_GLB), buf=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
  delete window.SOSHIE_GLB;
  loader.parse(buf.buffer,'',received);
} else loader.load('soshie-lite.glb', received);

let hop = null;
const bounce = () => hop = 0;

/* ---------------------------------------------- play ---- */
const el = id => document.getElementById(id);
const inList = el('in-list'), outList = el('out-list'), dropZone = el('drop');
const MAX_IN = 3, WORK_MS = 950;

let shipped = 0, working = 0, bag = [], waiting = [], nextIn = 0.6;

function pick(){
  if (!bag.length){ bag = WORK.map((_,i)=>i);
    for (let i=bag.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [bag[i],bag[j]]=[bag[j],bag[i]]; } }
  return WORK[bag.pop()];
}

function addBrief(){
  if (waiting.length >= MAX_IN) return;
  const [brief, caption, tag] = pick();
  const node = document.createElement('div');
  node.className = 'brief'; node.tabIndex = 0;
  node.innerHTML = `<div class="src">${FROM[(Math.random()*FROM.length)|0]}</div>
                    <div class="txt">${brief}</div>`;
  const item = {node, caption, tag};
  node.addEventListener('pointerdown', e => grab(e, item));
  node.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); hand(item); }
  });
  inList.appendChild(node);
  waiting.push(item);
  tally();
}

function tally(){
  el('in-n').textContent = waiting.length;
  el('in-head').classList.toggle('busy', waiting.length >= MAX_IN);
  el('s-done').textContent = shipped;
  el('s-hours').textContent = (shipped * 25 / 60).toFixed(1) + 'h';
  el('busy').classList.toggle('on', working > 0);
  el('busy').textContent = working > 1 ? `working on ${working}…` : 'working…';
}

function hand(item){
  if (!waiting.includes(item)) return;
  waiting = waiting.filter(w => w !== item);
  item.node.classList.add('leaving');
  setTimeout(() => item.node.remove(), 340);
  working++; bounce(); tally();
  setTimeout(() => { working--; ship(item); tally(); }, WORK_MS);
}

function ship(item){
  shipped++;
  const d = document.createElement('div');
  d.className = 'done';
  d.innerHTML = `<div class="cap">${item.caption}</div>
                 <div class="tag"><i></i>${item.tag}</div>`;
  outList.prepend(d);
  while (outList.children.length > 4) outList.lastElementChild.remove();
}

/* drag, or simply click */
function grab(e, item){
  e.preventDefault();
  const r = item.node.getBoundingClientRect();
  const dx = e.clientX - r.left, dy = e.clientY - r.top;
  let ghost = null, moved = false;
  dropZone.classList.add('armed');

  const move = ev => {
    if (!moved && Math.hypot(ev.clientX-e.clientX, ev.clientY-e.clientY) < 6) return;
    if (!moved){
      moved = true;
      ghost = item.node.cloneNode(true);
      ghost.classList.add('drag');
      document.body.appendChild(ghost);
      item.node.style.opacity = .3;
    }
    ghost.style.left = (ev.clientX - dx) + 'px';
    ghost.style.top  = (ev.clientY - dy) + 'px';
    dropZone.classList.toggle('hit', overDrop(ev.clientX, ev.clientY));
  };
  const up = ev => {
    removeEventListener('pointermove', move);
    removeEventListener('pointerup', up);
    dropZone.classList.remove('armed','hit');
    if (ghost) ghost.remove();
    item.node.style.opacity = '';
    if (!moved || overDrop(ev.clientX, ev.clientY)) hand(item);   // a click counts too
  };
  addEventListener('pointermove', move);
  addEventListener('pointerup', up);
}

function overDrop(x, y){
  const r = dropZone.getBoundingClientRect();
  const nx = (x - (r.left + r.width/2)) / (r.width/2);
  const ny = (y - (r.top + r.height/2)) / (r.height/2);
  return nx*nx + ny*ny <= 1.25;      // a forgiving ellipse around her
}

addBrief();

let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now - last)/1000); last = now;

  nextIn -= dt;
  if (nextIn <= 0){ addBrief(); nextIn = 3.1 + Math.random()*1.4; }

  const t = now/1000;
  rig.rotation.y = Math.sin(t*0.42)*0.17;
  rig.position.y = Math.sin(t*1.1)*0.0016;
  if (hop !== null){
    hop += dt;
    const k = Math.max(0, 1 - hop/0.5);
    rig.position.y += Math.abs(Math.sin(hop*13))*0.007*k;
    if (hop > 0.5) hop = null;
  }
  renderer.render(scene, camera);
});
addEventListener('resize', frame);
</script>
